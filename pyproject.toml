[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "etf-next-day-screener"
version = "1.0.0"
description = "FastAPI dashboard for the ETF next-day signal screener"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "yfinance>=0.2.28",
    "scikit-learn>=1.3.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "etf_signals*"]

[tool.setuptools.package-data]
app = ["static/**/*"]
etf_signals = ["data/*"]
